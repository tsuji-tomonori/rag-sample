name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: uv sync --locked --all-groups
      - run: npm ci
      - run: uv run ruff check . && uv run ruff format --check .
      - run: uv run pyright && npm run typecheck
      - run: uv run pytest && npm test
      - run: npm run build
      - run: uv run app-docs --check && npm run docs:web:check && npm run docs:infra:check
      - run: uv run python tools/validate_skills.py
      - run: npm run synth -w @rag-engineering/infra -- --quiet
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e -w @rag-engineering/web

