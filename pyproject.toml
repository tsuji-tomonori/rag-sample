[project]
name = "rag-engineering-workspace"
version = "0.1.0"
description = "Evidence-first RAG system based on the RAG engineering guide"
requires-python = ">=3.12"
dependencies = [
  "anyio==4.13.0",
  "boto3>=1.42,<2",
  "fastapi[standard-no-fastapi-cloud-cli]==0.136.3",
  "pydantic-settings>=2.10,<3",
  "pyjwt[crypto]>=2.10,<3",
  "starlette==1.2.1",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
app-docs = "tools.docs:main"
app-eval = "app_tool.evaluate:main"

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "mangum>=0.19,<1",
  "mypy>=1.18,<2",
  "pre-commit>=4.2,<5",
  "pyright>=1.1.405,<2",
  "pytest==9.0.3",
  "pytest-cov==7.1.0",
  "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/app", "src/app_tool", "src/tools"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
include = ["src"]
venvPath = "."
venv = ".venv"
reportUnusedFunction = false

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app", "app_tool", "tools"]
warn_unused_ignores = true
